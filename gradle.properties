# Gradle JVM settings
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Use JDK 21 for Gradle daemon
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
# Enable parallel project execution
org.gradle.parallel=true
# Enable build cache
org.gradle.caching=true
# Enable configuration cache
org.gradle.configuration-cache=true
# AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Optimize R class and resource IDs
android.nonTransitiveRClass=true
# Disable AGP 9 resource name obfuscation (breaks aboutlibraries runtime lookup)
android.enableResourceOptimizations=false
# Enable incremental compilation
kotlin.incremental=true
kotlin.incremental.java=true
# Gradle Daemon optimization
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
